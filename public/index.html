<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Temporal Chat Agent · React</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-base: #090a0f;
      --bg-sidebar: #0f1118;
      --bg-card: #151822;
      --bg-hover: #1c202d;
      --border-subtle: #242938;
      --border-accent: #374151;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --text-dark: #6b7280;
      --brand-blue: #60a5fa;
      --brand-cyan: #38bdf8;
      --brand-green: #34d399;
      --brand-orange: #fb923c;
      --brand-red: #f87171;
      --brand-purple: #c084fc;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-base);
      color: var(--text-main);
      height: 100vh;
      overflow: hidden;
    }

    #root { height: 100vh; }

    /* App Layout */
    .app-shell { display: flex; height: 100vh; width: 100vw; overflow: hidden; }

    /* Sidebar */
    .app-sidebar {
      width: 320px;
      min-width: 320px;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: width 0.2s ease, min-width 0.2s ease;
    }

    .app-sidebar.collapsed {
      display: none;
    }

    .sidebar-brand {
      padding: 18px 20px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .sidebar-close-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-dark);
      border-radius: 6px;
      padding: 4px 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }

    .sidebar-close-btn:hover {
      background: var(--bg-hover);
      color: var(--text-main);
      border-color: var(--border-subtle);
    }

    .brand-status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--brand-green);
      box-shadow: 0 0 10px rgba(52, 211, 153, 0.6);
    }

    .sidebar-brand h2 {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.2px;
      color: var(--text-main);
    }

    .brand-subtitle {
      font-size: 11px;
      color: var(--text-dark);
      font-family: var(--font-mono);
      display: block;
      margin-top: 2px;
    }

    .sidebar-content {
      flex: 1;
      overflow-y: auto;
      padding: 14px 16px;
      scrollbar-width: thin;
      scrollbar-color: var(--border-subtle) transparent;
    }

    .sidebar-section { margin-bottom: 24px; }
    .section-title {
      font-size: 10px;
      font-weight: 700;
      color: var(--text-dark);
      letter-spacing: 1.1px;
      margin-bottom: 10px;
      font-family: var(--font-mono);
    }

    /* Quick Tests */
    .quick-tests-list { display: flex; flex-direction: column; gap: 8px; }

    .quick-test-btn {
      text-align: left;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 10px 12px;
      cursor: pointer;
      color: var(--text-muted);
      transition: all 0.15s ease;
      font-family: var(--font-sans);
    }

    .quick-test-btn:hover {
      background: var(--bg-hover);
      border-color: var(--brand-blue);
      color: var(--text-main);
      transform: translateY(-1px);
    }

    .quick-test-badge {
      font-size: 10px;
      font-weight: 600;
      color: var(--brand-blue);
      letter-spacing: 0.5px;
      margin-bottom: 4px;
      font-family: var(--font-mono);
    }

    .quick-test-text {
      font-size: 12px;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Timeline Items */
    .timeline-list { display: flex; flex-direction: column; gap: 6px; }

    .timeline-item {
      padding: 9px 12px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .timeline-item:hover {
      background: var(--bg-hover);
      border-color: var(--brand-cyan);
    }

    .timeline-date-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-main);
    }

    .timeline-date-meta {
      font-size: 11px;
      color: var(--text-dark);
      margin-top: 3px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot-sep { font-weight: bold; }
    .timeline-sessions { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); }
    .timeline-empty { font-size: 12px; color: var(--text-dark); padding: 8px 0; }

    /* New Chat Actions */
    .sidebar-actions {
      padding: 14px 16px 0 16px;
    }

    .new-chat-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 14px;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 8px;
      color: var(--brand-cyan);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: var(--font-sans);
      transition: all 0.15s ease;
    }

    .new-chat-btn:hover {
      background: rgba(56, 189, 248, 0.22);
      border-color: var(--brand-cyan);
      color: #fff;
      transform: translateY(-1px);
    }

    .new-chat-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .navbar-new-chat-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      color: var(--brand-cyan);
      border-radius: 6px;
      padding: 5px 10px;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      font-family: var(--font-sans);
      transition: all 0.15s ease;
    }

    .navbar-new-chat-btn:hover {
      background: rgba(56, 189, 248, 0.15);
      border-color: var(--brand-cyan);
      color: #fff;
    }

    .navbar-new-chat-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Reset Button */
    .reset-db-btn {
      width: 100%;
      padding: 9px 12px;
      background: rgba(248, 113, 113, 0.1);
      border: 1px solid rgba(248, 113, 113, 0.25);
      border-radius: 6px;
      color: var(--brand-red);
      font-size: 11px;
      font-weight: 600;
      font-family: var(--font-mono);
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .reset-db-btn:hover { background: rgba(248, 113, 113, 0.2); }
    .reset-db-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Chat Area */
    .chat-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--bg-base);
      overflow: hidden;
    }

    .chat-navbar {
      height: 52px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      background: var(--bg-sidebar);
    }

    .navbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .sidebar-toggle-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      border-radius: 6px;
      padding: 5px 9px;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 500;
      font-family: var(--font-sans);
      transition: all 0.15s ease;
    }

    .sidebar-toggle-btn:hover {
      background: var(--bg-hover);
      color: var(--text-main);
      border-color: var(--border-accent);
    }

    .navbar-session { display: flex; align-items: center; gap: 8px; }
    .session-tag {
      font-size: 10px;
      font-family: var(--font-mono);
      padding: 2px 6px;
      background: var(--bg-card);
      border-radius: 4px;
      color: var(--text-dark);
    }

    .session-id { font-size: 12px; font-weight: 600; color: var(--brand-cyan); font-family: var(--font-mono); }
    .navbar-stats { font-size: 11px; color: var(--text-dark); font-family: var(--font-mono); }

    .chat-scroll-area {
      flex: 1;
      overflow-y: auto;
      padding: 24px 32px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      scrollbar-width: thin;
      scrollbar-color: var(--border-subtle) transparent;
    }

    /* Message Rows */
    .message-row { max-width: 860px; width: 100%; display: flex; flex-direction: column; }
    .message-header { margin-bottom: 6px; }

    .role-tag {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.6px;
      font-family: var(--font-mono);
    }

    .role-tag.user { color: var(--brand-blue); }
    .role-tag.assistant { color: var(--brand-green); }

    .user-text-bubble {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      padding: 14px 18px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.6;
      color: var(--text-main);
    }

    .assistant-markdown-bubble {
      font-size: 14px;
      line-height: 1.7;
      color: #e5e7eb;
    }

    /* Markdown Styling */
    .markdown-body h1, .markdown-body h2, .markdown-body h3 {
      color: #ffffff;
      margin: 16px 0 8px;
      font-weight: 700;
    }
    .markdown-body h1 { font-size: 18px; }
    .markdown-body h2 { font-size: 16px; }
    .markdown-body h3 { font-size: 14px; }
    .markdown-body p { margin-bottom: 10px; }
    .markdown-body ul, .markdown-body ol { margin: 8px 0 12px 20px; }
    .markdown-body li { margin-bottom: 4px; }

    .markdown-body table {
      width: 100%;
      border-collapse: collapse;
      margin: 14px 0;
      font-size: 13px;
    }

    .markdown-body th, .markdown-body td {
      border: 1px solid var(--border-accent);
      padding: 8px 12px;
      text-align: left;
    }

    .markdown-body th { background: var(--bg-card); font-weight: 600; color: #fff; }
    .markdown-body code {
      font-family: var(--font-mono);
      background: var(--bg-card);
      padding: 2px 5px;
      border-radius: 4px;
      font-size: 12px;
      color: var(--brand-cyan);
    }

    .markdown-body a { color: var(--brand-blue); text-decoration: none; border-bottom: 1px dashed var(--brand-blue); }
    .markdown-body a:hover { color: #93c5fd; border-bottom-style: solid; }

    /* Agent Trace Pill */
    .trace-container { margin: 6px 0 10px; }

    .trace-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 20px;
      padding: 5px 12px;
      cursor: pointer;
      font-size: 11px;
      color: var(--brand-cyan);
      font-family: var(--font-mono);
      transition: background 0.15s ease;
    }

    .trace-pill:hover { background: rgba(56, 189, 248, 0.18); }
    .trace-arrow { font-size: 8px; transition: transform 0.15s ease; display: inline-block; }
    .trace-arrow.open { transform: rotate(90deg); }

    .trace-details {
      margin-top: 8px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 12px 14px;
      font-family: var(--font-mono);
      font-size: 11px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .trace-header {
      font-size: 9px;
      font-weight: 700;
      color: var(--text-dark);
      letter-spacing: 0.8px;
      margin-bottom: 4px;
    }

    .trace-query-list { list-style: none; padding-left: 2px; }
    .trace-query-item { color: var(--brand-purple); margin-bottom: 2px; }
    .query-arrow { color: var(--text-dark); }
    .trace-stats-row { display: flex; gap: 8px; }

    .stat-badge {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 10px;
    }

    .stat-badge.green { background: rgba(52, 211, 153, 0.15); color: var(--brand-green); }
    .stat-badge.orange { background: rgba(251, 146, 60, 0.15); color: var(--brand-orange); }

    /* Status Indicator */
    .agent-status-indicator {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--brand-cyan);
      padding: 6px 12px;
      background: rgba(56, 189, 248, 0.08);
      border-radius: 6px;
      width: fit-content;
    }

    .spinner-orbit {
      width: 12px;
      height: 12px;
      border: 2px solid var(--border-accent);
      border-top-color: var(--brand-cyan);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Empty state */
    .chat-empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      text-align: center;
      padding: 40px;
    }
    .empty-icon { font-size: 32px; margin-bottom: 12px; }
    .chat-empty-state h3 { font-size: 16px; color: #fff; margin-bottom: 6px; }
    .chat-empty-state p { font-size: 13px; max-width: 440px; line-height: 1.5; color: var(--text-dark); }

    /* Input Footer */
    .chat-footer {
      padding: 16px 32px 20px;
      background: var(--bg-sidebar);
      border-top: 1px solid var(--border-subtle);
    }

    .chat-form { display: flex; gap: 12px; align-items: flex-end; }

    .chat-textarea {
      flex: 1;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 12px 16px;
      color: var(--text-main);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.5;
      resize: none;
      min-height: 46px;
      max-height: 140px;
      outline: none;
      transition: border-color 0.15s ease;
    }

    .chat-textarea:focus { border-color: var(--brand-blue); }
    .chat-textarea::placeholder { color: var(--text-dark); }

    .send-button {
      padding: 12px 22px;
      background: #2563eb;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
      white-space: nowrap;
    }

    .send-button:hover { background: #1d4ed8; }
    .send-button:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Modal Backdrop */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(2px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-card {
      background: var(--bg-sidebar);
      border: 1px solid var(--border-accent);
      border-radius: 12px;
      width: 720px;
      max-height: 82vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }

    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-header h3 { font-size: 15px; font-weight: 700; color: #fff; }
    .modal-subtitle { font-size: 12px; color: var(--text-dark); font-family: var(--font-mono); margin-top: 2px; }

    .modal-close-btn {
      background: transparent;
      border: none;
      color: var(--text-dark);
      font-size: 16px;
      cursor: pointer;
    }

    .modal-close-btn:hover { color: var(--text-main); }

    .modal-body {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .modal-msg-bubble {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 12px 14px;
    }

    .modal-msg-bubble.user { border-left: 3px solid var(--brand-blue); }
    .modal-msg-bubble.assistant { border-left: 3px solid var(--brand-green); }

    .modal-msg-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 10px;
      font-family: var(--font-mono);
      margin-bottom: 6px;
      color: var(--text-dark);
    }

    .meta-role { font-weight: 700; color: var(--text-muted); }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/bundle.js"></script>
</body>
</html>
